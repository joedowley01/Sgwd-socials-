<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d2340"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><title>Sgwd Social Coach</title>
<style>:root{--navy:#0d2340;--gold:#c5a35a;--ink:#101828;--muted:#667085;--bg:#f6f3ed;--card:#fff;--line:#e7e0d4;--good:#16835d;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(18px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}main{max-width:760px;margin:auto}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.mark{width:48px;height:48px;border-radius:14px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-size:25px}.brand h1{font-size:23px;margin:0;color:var(--navy)}.small{font-size:12px;color:var(--muted)}.hero{background:var(--navy);color:white;border-radius:22px;padding:18px;margin-bottom:12px}.hero .eyebrow{color:#e5d2a5;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.hero h2{font-size:26px;margin:6px 0}.hero p{margin:0;color:#dce3eb;line-height:1.4}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card,.kpi{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px}.kpi small{display:block;color:var(--muted)}.kpi strong{font-size:24px;color:var(--navy)}.up{color:var(--good)}.down{color:var(--bad)}.platform{margin-top:10px}.platform h3,.card h3{margin:0 0 8px}.row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:9px 0}.row:first-of-type{border-top:0}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:13px 0}.tabs button,.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:12px;padding:11px 5px;font-weight:800}.tabs button.active,.btn.primary{background:var(--navy);color:white;border-color:var(--navy)}.tag{display:inline-block;font-size:11px;border:1px solid var(--gold);color:#765c27;border-radius:999px;padding:3px 7px}.coach p{line-height:1.45}.planner input,.planner select,.planner textarea{width:100%;margin:5px 0;border:1px solid var(--line);border-radius:11px;padding:11px;background:white;font:inherit}.planner textarea{min-height:90px}.btn{width:100%;margin-top:5px}.note{font-size:13px;color:var(--muted);background:#f0ebe1;border-radius:12px;padding:11px;margin-top:10px}.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:736px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#fffef8ed;border:1px solid var(--line);border-radius:18px;padding:7px;backdrop-filter:blur(12px)}.nav button{border:0;background:transparent;color:var(--muted);border-radius:11px;padding:11px 3px;font-weight:800}.nav button.active{background:var(--navy);color:white}.syncbar{display:flex;justify-content:space-between;align-items:center;background:#eaf3ef;border:1px solid #cce3d9;border-radius:12px;padding:9px 11px;margin-bottom:10px;font-size:12px}.syncdot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;margin-right:6px}.syncbtn{border:0;background:transparent;color:var(--navy);font-weight:800}</style></head>
<body><main><div class="brand"><div class="mark">♛</div><div><h1>Sgwd Gwladys</h1><div class="small">SOCIAL COACH • PONTNEDDFECHAN</div></div></div><div class="syncbar"><span><i class="syncdot"></i><b id="syncState">Shared mode ready</b></span><button class="syncbtn" id="syncInfo">Joe + Luke</button></div><div id="body"></div><nav class="nav"><button data-tab="dashboard" class="active">Dashboard</button><button data-tab="coach">Coach</button><button data-tab="content">Content</button><button data-tab="plan">Plan</button></nav></main>
<script>
const SHARED_KEY="sgwdSharedV1";function shared(){return JSON.parse(localStorage.getItem(SHARED_KEY)||'{"planner":[],"notes":[],"updated":null}')}function saveShared(v){v.updated=new Date().toISOString();localStorage.setItem(SHARED_KEY,JSON.stringify(v));window.dispatchEvent(new Event("sgwd-sync"));}function updateSync(){let e=document.querySelector("#syncState"),v=shared();if(e)e.textContent=v.updated?"Saved on this device":"Shared mode ready"}window.addEventListener("storage",updateSync);window.addEventListener("sgwd-sync",updateSync);
const baseline={date:"1 Oct 2026",instagram:{views:166600,interactions:3700,follows:319,clicks:27,vc:46.9,ic:208,fc:66.1,cc:-64},facebook:{views:243700,interactions:1700,follows:135,clicks:70,vc:41.7,ic:94,fc:-10.6,cc:2200},top:[["Food / venue",42300],["Food",36100],["Waterfall / location",29700],["Dining experience",23300],["Sunday roast",20700],["People / venue",20300]]};let tab="dashboard";const $=s=>document.querySelector(s),fmt=n=>n>=1000?(n/1000).toFixed(1)+"K":n,chg=n=>'<span class="'+(n>=0?'up':'down')+'">'+(n>=0?'↑':'↓')+' '+Math.abs(n)+'%</span>';
function render(){document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));let x=baseline,c={views:x.instagram.views+x.facebook.views,interactions:x.instagram.interactions+x.facebook.interactions,follows:x.instagram.follows+x.facebook.follows,clicks:x.instagram.clicks+x.facebook.clicks};if(tab==="dashboard")$("#body").innerHTML='<section class="hero"><div class="eyebrow">28-day baseline • '+x.date+'</div><h2>'+fmt(c.views)+' views</h2><p>Sgwd’s starting point. We’ll measure future performance against this baseline.</p></section><div class="kpis"><div class="kpi"><small>Interactions</small><strong>'+fmt(c.interactions)+'</strong></div><div class="kpi"><small>Follows</small><strong>'+c.follows+'</strong></div><div class="kpi"><small>Link clicks</small><strong>'+c.clicks+'</strong></div><div class="kpi"><small>Paid ads</small><strong>£0</strong></div></div>'+platform("Instagram",x.instagram)+platform("Facebook",x.facebook)+'<div class="note">Live Meta import is the next connection step. No Meta passwords or access tokens are stored in this page.</div>';else if(tab==="coach")$("#body").innerHTML='<section class="hero"><div class="eyebrow">V2 • Coach</div><h2>Turn attention into visits</h2><p>Your strongest opportunity is converting growing reach and engagement into measurable actions.</p></section><div class="card coach"><h3>This week</h3><p><b>Instagram:</b> interactions are up '+x.instagram.ic+'%, but link clicks are down '+Math.abs(x.instagram.cc)+'%. Test clearer “book / view menu” calls-to-action.</p><p><b>Facebook:</b> link clicks are currently stronger. Keep booking and menu links prominent.</p><p><b>Experiment:</b> run one food Reel and one waterfall/location Reel with the same CTA, then compare follows and clicks per 1,000 views.</p></div>';else if(tab==="content")$("#body").innerHTML='<section class="hero"><div class="eyebrow">V3 • Intelligence</div><h2>What works for Sgwd</h2><p>Tag content by theme and learn what drives reach, engagement and action.</p></section><div class="card"><h3>Top content</h3>'+x.top.map((q,i)=>'<div class="row"><span>#'+(i+1)+' <span class="tag">'+q[0]+'</span></span><b>'+fmt(q[1])+' views</b></div>').join("")+'</div>';else{let p=shared().planner;$("#body").innerHTML='<section class="hero"><div class="eyebrow">V4 • Planner</div><h2>Plan → post → learn</h2><p>Build the week around Sgwd’s actual performance.</p></section><div class="card planner"><h3>Add content</h3><select id="type"><option>Food</option><option>Scenery</option><option>Event</option><option>Staff</option><option>Offer</option><option>Behind the scenes</option></select><input id="date" type="date"><textarea id="idea" placeholder="Post idea, hook or offer…"></textarea><button id="add" class="btn primary">Add to plan</button></div>'+p.map((q,i)=>'<div class="card platform"><div class="row"><b>'+q.type+' • '+q.date+'</b><button data-del="'+i+'">×</button></div><div>'+q.idea+'</div></div>').join("")+'<div class="note"><b>Suggested mix:</b> food Reel with booking CTA • waterfall/location Reel • event push • behind-the-scenes Stories.</div>';let d=$("#date");if(d)d.value=new Date().toISOString().slice(0,10)}
}
function platform(name,p){return '<div class="card platform"><h3>'+name+'</h3><div class="row"><span>Views</span><b>'+fmt(p.views)+' '+chg(p.vc)+'</b></div><div class="row"><span>Interactions</span><b>'+fmt(p.interactions)+' '+chg(p.ic)+'</b></div><div class="row"><span>Follows</span><b>'+p.follows+' '+chg(p.fc)+'</b></div><div class="row"><span>Link clicks</span><b>'+p.clicks+' '+chg(p.cc)+'</b></div></div>'}
document.addEventListener("click",e=>{let t=e.target.closest("[data-tab]"),d=e.target.closest("[data-del]");if(t){tab=t.dataset.tab;render()}else if(e.target.id==="add"){let idea=$("#idea").value.trim();if(!idea)return;let v=shared();v.planner.push({type:$("#type").value,date:$("#date").value,idea,by:"Team"});saveShared(v);render()}else if(d){let v=shared();v.planner.splice(+d.dataset.del,1);saveShared(v);render()}});document.addEventListener("click",e=>{if(e.target.id==="syncInfo")alert("The app is prepared for Joe + Luke shared data. The next connection is a cloud database so both phones see the same planner instantly.")});render();updateSync();
</script></body></html>
